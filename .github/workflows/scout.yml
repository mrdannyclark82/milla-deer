name: Scout Technology Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scout dependency
        run: |
          mkdir -p "$RUNNER_TEMP/scout-deps"
          npm install --prefix "$RUNNER_TEMP/scout-deps" axios

      - name: Run Scout Script and Generate Report
        id: scout_report
        env:
          NODE_PATH: ${{ runner.temp }}/scout-deps/node_modules
        run: |
          cp .github/scripts/scout.js "$RUNNER_TEMP/scout.cjs"
          report_content=$(node "$RUNNER_TEMP/scout.cjs")
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$report_content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = `${{ steps.scout_report.outputs.report }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Radar Tecnológico - ${new Date().toLocaleDateString()}`,
              body: report || 'Scout completed with empty report.'
            });
