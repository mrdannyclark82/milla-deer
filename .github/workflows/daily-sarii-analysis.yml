name: Daily SARIi Analysis

on:
  schedule:
    # ~6:30 AM CDT every day
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  daily-sarii:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout milla-deer (SARIi + core)
        uses: actions/checkout@v4
        with:
          repository: mrdannyclark82/milla-deer
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Aetherboot
        uses: actions/checkout@v4
        with:
          repository: mrdannyclark82/Aetherboot
          path: aetherboot
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout GCCli
        uses: actions/checkout@v4
        with:
          repository: mrdannyclark82/GCCli
          path: gccli
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Daily SARIi Cycle
        run: |
          echo "=========================================="
          echo "Daily SARIi Report - $(date)"
          echo "Targets: milla-deer + Aetherboot + GCCli"
          echo "=========================================="
          echo ""
          echo "SARIi running full cycle on:"
          echo "  • milla-deer (core + SARIi agent itself)"
          echo "  • Aetherboot (AI Boot manager)"
          echo "  • GCCli (Custom Grok CLI)"
          echo ""
          echo "Analysis focus:"
          echo "  - Current real state vs vision"
          echo "  - Related technology research"
          echo "  - Prioritized enhancement opportunities"
          echo "  - Quick wins, blockers, and next actions"
          echo ""
          echo "Full report + email will be generated by SARIi."
